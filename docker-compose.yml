# Fase 4: entorno local independiente de MySQL/XAMPP.
# Puertos externos: API 8081 (configurable); MySQL solo accesible internamente.
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Define MYSQL_DATABASE en .env}
      MYSQL_USER: ${MYSQL_USER:?Define MYSQL_USER en .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql --protocol=TCP -h 127.0.0.1
          --user="$${MYSQL_USER}" --password="$${MYSQL_PASSWORD}"
          --database="$${MYSQL_DATABASE}" -Nse 'SELECT 1' >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: restaurante-api:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:?Define MYSQL_DATABASE en .env}
      DB_USER: ${MYSQL_USER:?Define MYSQL_USER en .env}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
      PORT: "8080"
    ports:
      - "127.0.0.1:${APP_PORT:-8081}:8080"

volumes:
  mysql_data:
