spring.application.name=restaurante-api
server.port=${PORT:8080}

# Configuracion compatible con MySQL local (XAMPP) o MySQL en la nube.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:restaurante_db}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Para desarrollo local. En produccion se recomienda migraciones controladas.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

spring.jackson.serialization.write-dates-as-timestamps=false
